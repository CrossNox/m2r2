name: Lint

on:
  push:
    branches: [master, main, v2]
  pull_request:
    branches: [master, main, v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check m2r2/ tests/

      - name: Lint
        run: uv run ruff check m2r2/ tests/

      - name: Type check
        run: uv run mypy m2r2/

      - name: Security scan
        run: uv run bandit -r m2r2/ -c pyproject.toml
