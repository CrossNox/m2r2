name: Run bandit

on:
  push:
    branches: development
  pull_request:
    branches: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3
      uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: pip install nox
    - name: Run bandit
      run: nox --sessions bandit
