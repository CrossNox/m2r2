name: Deploy to pypi

on:
  push:
    branches: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Build package
      #if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      run: |
        pip install wheel
        python setup.py sdist bdist_wheel
    - name: Publish package
      #if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@master
      with:
        user: __token__
        password: ${{ secrets.pypi_token }}
