name: Deploy to PyPI

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/tests.yml

  lint:
    uses: ./.github/workflows/lint.yml

  untagged_deploy:
    runs-on: ubuntu-latest
    needs: [check, lint]
    if: ${{ !startsWith(github.ref, 'refs/tags') }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/m2r2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Publish package to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  tagged_deploy:
    runs-on: ubuntu-latest
    needs: [check, lint]
    environment:
      name: pypi
      url: https://pypi.org/p/m2r2
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Build documentation
        run: uv run sphinx-build -W -E -n -j auto -b html docs docs/_build/html

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentationHTML
          path: docs/_build/html/

      - name: Commit documentation changes
        run: |
          git clone https://github.com/crossnox/m2r2.git --branch gh-pages --single-branch gh-pages
          cd gh-pages
          git rm -rf .
          cd ..
          cp -a docs/_build/html/. gh-pages/
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update documentation ${{ github.ref }}"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@57116acb309081ee57864270b0e3c4cedbe45452  # v0.8.0
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GH_TOKEN }}
