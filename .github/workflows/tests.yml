name: Run tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.5, 3.6, 3.7, 3.8]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run tests session
      run: |
        pip install nox
        nox --sessions tests --python ${{ matrix.python-version }}
    - name: Test old sphinx building
      run: |
        nox --sessions test_sphinx_old_build --python ${{ matrix.python-version }}
    - name: Test sphinx building
      run: |
        nox --sessions test_sphinx_build --python ${{ matrix.python-version }}

